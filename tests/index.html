<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Woogi Tools Tests</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      /* The app is laid out at 1280x768 and shown at half size, out of the
         way of the results. The transform keeps position: fixed layers (PiP
         windows, dialogs) inside the box. */
      #app-testing-container {
        position: relative;
        background: white;
        width: 640px;
        height: 384px;
        overflow: auto;
        z-index: 98;
        border: 1px solid #ccc;
        margin: 0 auto;
        transform: translateZ(0);
      }
      #app-testing {
        width: 200%;
        height: 200%;
        transform: scale(0.5);
        transform-origin: top left;
      }
    </style>
  </head>
  <body>
    <div id="qunit"></div>
    <div id="qunit-fixture">
      <div id="app-testing-container">
        <div id="app-testing"></div>
      </div>
    </div>

    <script type="module">
      import * as QUnit from 'qunit';
      QUnit.config.autostart = false;
      const { start } = await import('./test-helper.js');
      import.meta.glob(['./acceptance/*-test.js', './unit/*-test.js'], { eager: true });
      start();
    </script>
  </body>
</html>
