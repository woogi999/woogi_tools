<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Woogi Tools</title>
    <meta name="description" content="Small, fun, single-purpose web tools.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.png">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('woogi-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          var motion = localStorage.getItem('woogi-motion');
          if (motion === 'reduce') document.documentElement.setAttribute('data-motion', motion);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      html { background: #121212; color-scheme: dark; }
      html[data-theme='light'] { background: #fafafa; color-scheme: light; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400..700&family=Moderustic:wght@400..700&display=swap" rel="stylesheet">

  </head>
  <body>
    <script type="module" src="/app/main.js"></script>
  </body>
</html>
